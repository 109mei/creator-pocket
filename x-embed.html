<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><style>body{margin:0;background:#fff;font:14px system-ui;color:#48424e}#tweet{max-width:550px;margin:auto;min-height:300px}p{padding:24px;text-align:center}a{color:#4c4380}</style></head><body><div id="tweet"><p>X公式投稿を読み込み中…</p></div><script>
const id=new URLSearchParams(location.search).get('id');const send=(type,data={})=>parent.postMessage({source:'creator-pocket-x',type,...data},'*');if(!/^\d{1,20}$/.test(id||'')){document.querySelector('#tweet').textContent='無効な投稿IDです。';send('error');}else{const script=document.createElement('script');script.src='https://platform.x.com/widgets.js';script.async=true;script.onload=()=>{if(!window.twttr?.widgets){send('error');return;}document.querySelector('#tweet').textContent='';twttr.widgets.createTweet(id,document.querySelector('#tweet'),{dnt:true,conversation:'none',width:Math.max(220,Math.min(500,innerWidth)),theme:'light'}).then(el=>send(el?'ready':'error')).catch(()=>send('error'));};script.onerror=()=>{document.querySelector('#tweet').textContent='Xに接続できませんでした。元リンクをご利用ください。';send('error');};document.head.append(script);new ResizeObserver(()=>send('height',{height:document.body.scrollHeight})).observe(document.body);}
</script></body></html>
